$kind: http-request
description: |
  Тело запроса отсутствует.

  Проверки сервера: владелец сессии -> состояние `CREATED` ->
  `1 ≤ partNumber ≤ partCount`. Подписывается `UploadPart` для
  `bucket`, `storage_path`, `uploadId`, `partNumber`; TTL URL — N минут.

  Клиент не получает credentials хранилища. Истёкший URL отклоняется
  хранилищем, после чего клиент запрашивает новый.
url: "{{baseUrl}}/api/v1/upload-sessions/:sessionId/parts/:partNumber/url"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: sessionId
    value: "{{createdSessionUuid}}"
    description: |
      UUID сессии загрузки из ответа `201` на создание сессии.
      Нет сессии или она чужая -> 404 SESSION_NOT_FOUND.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: partNumber
    value: "1"
    description: |
      Номер части в диапазоне `1..partCount`. Вне диапазона -> 422 PART_NUMBER_OUT_OF_RANGE.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "format": "int32",
            "minimum": 1,
            "maximum": 10
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      
      const responseJson = pm.response.json();
      const awsPresignedUrl = responseJson.url; 

      pm.collectionVariables.set('awsPresignedUrl', awsPresignedUrl);

      pm.test('AWS Presigned URL is present', () => {
          pm.expect(awsPresignedUrl).to.be.a('string').and.not.empty;
      });
    language: text/javascript
settings: {}
examples: .resources/02 Выдать presigned UploadPart URL для части.resources/examples
order: 8637
